name: Build Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        flavor: [de, fr]
    env:
      # Per-app AdMob IDs; Google's test IDs are used when a secret is missing.
      ADMOB_APP_ID_DE: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_APP_ID_FR: ${{ secrets.ADMOB_APP_ID_FR }}
      AD_INTERSTITIAL: ${{ matrix.flavor == 'fr' && secrets.ADMOB_INTERSTITIAL_FR || secrets.ADMOB_INTERSTITIAL }}
      AD_REWARDED: ${{ matrix.flavor == 'fr' && secrets.ADMOB_REWARDED_FR || secrets.ADMOB_REWARDED }}
      AD_BANNER: ${{ matrix.flavor == 'fr' && secrets.ADMOB_BANNER_FR || secrets.ADMOB_BANNER }}
      # Job-level so that the step `if:` below can see it (step-level env is not visible there).
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
      # Server-side purchase/integrity verification (lib/services/integrity.dart).
      # Empty values build the app with verification switched off.
      VERIFY_URL: ${{ vars.VERIFY_URL }}
      VERIFY_KEY: ${{ vars.VERIFY_KEY }}
      PLAY_CLOUD_PROJECT: ${{ vars.PLAY_CLOUD_PROJECT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Launcher icons
        run: dart run flutter_launcher_icons

      - name: Test
        run: flutter test || true

      - name: Decode keystore (if configured)
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build APK (debug-signed if no keystore)
        run: |
          flutter build apk --release --flavor ${{ matrix.flavor }} \
            --dart-define=EXAM=${{ matrix.flavor }} \
            --dart-define=ADMOB_INTERSTITIAL=$AD_INTERSTITIAL \
            --dart-define=ADMOB_REWARDED=$AD_REWARDED \
            --dart-define=ADMOB_BANNER=$AD_BANNER \
            --dart-define=VERIFY_URL=$VERIFY_URL \
            --dart-define=VERIFY_KEY=$VERIFY_KEY \
            --dart-define=PLAY_CLOUD_PROJECT=$PLAY_CLOUD_PROJECT \
            --obfuscate --split-debug-info=build/symbols/${{ matrix.flavor }}

      - name: Build AAB
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No upload keystore secrets - the AAB is debug-signed and Play Console will reject it."
          fi
          flutter build appbundle --release --flavor ${{ matrix.flavor }} \
            --dart-define=EXAM=${{ matrix.flavor }} \
            --dart-define=ADMOB_INTERSTITIAL=$AD_INTERSTITIAL \
            --dart-define=ADMOB_REWARDED=$AD_REWARDED \
            --dart-define=ADMOB_BANNER=$AD_BANNER \
            --dart-define=VERIFY_URL=$VERIFY_URL \
            --dart-define=VERIFY_KEY=$VERIFY_KEY \
            --dart-define=PLAY_CLOUD_PROJECT=$PLAY_CLOUD_PROJECT \
            --obfuscate --split-debug-info=build/symbols/${{ matrix.flavor }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor == 'fr' && 'examcivique' || 'einbtest' }}-apk
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor == 'fr' && 'examcivique' || 'einbtest' }}-symbols
          path: build/symbols/${{ matrix.flavor }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.flavor == 'fr' && 'examcivique' || 'einbtest' }}-aab
          path: build/app/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab

  # Puts the latest APKs on the `apk` branch so they can be fetched with plain git
  # (artifact downloads need a GitHub login in the browser).
  publish-apk:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-apk
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Push to apk branch
        run: |
          # Runs can finish out of order; never let an older commit overwrite a newer build.
          head=$(git ls-remote "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -n "$head" ] && [ "$head" != "$GITHUB_SHA" ]; then
            echo "Stale build $GITHUB_SHA (main is $head) - not publishing."
            exit 0
          fi
          mkdir out
          cp dl/einbtest-apk/*.apk out/Einbuergerungstest.apk
          cp dl/examcivique-apk/*.apk out/ExamenCivique.apk
          cp dl/einbtest-aab/*.aab out/Einbuergerungstest.aab
          cp dl/examcivique-aab/*.aab out/ExamenCivique.aab
          echo "Built from ${GITHUB_SHA} on $(date -u +%F' '%H:%M) UTC" > out/README.md
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "APKs and AABs for ${GITHUB_SHA} [skip ci]"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
