name: einbtest
description: Exam trainers (Einbürgerungstest DE, Examen civique FR) built from one code base.
publish_to: "none"
version: 1.0.0+5

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_mobile_ads: ^5.2.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/data/strings.json
    - assets/de/
    - assets/fr/
    - assets/images/
