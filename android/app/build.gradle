plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "de.einbtest.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    defaultConfig {
        minSdk 23
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    // One code base, one app per exam. `flutter build appbundle --flavor de|fr`
    flavorDimensions "exam"
    productFlavors {
        de {
            dimension "exam"
            applicationId "de.einbtest.app"
            resValue "string", "app_name", "Einbürgerungstest 2026"
            // AdMob App ID: Google's test ID by default, the real one comes from CI secrets
            manifestPlaceholders["admobAppId"] = System.getenv("ADMOB_APP_ID_DE") ?: (System.getenv("ADMOB_APP_ID") ?: "ca-app-pub-3940256099942544~3347511713")
        }
        fr {
            dimension "exam"
            applicationId "fr.examcivique.app"
            resValue "string", "app_name", "Examen civique 2026"
            manifestPlaceholders["admobAppId"] = System.getenv("ADMOB_APP_ID_FR") ?: "ca-app-pub-3940256099942544~3347511713"
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter { source "../.." }

dependencies {
    implementation "com.google.android.play:integrity:1.4.0"
}
